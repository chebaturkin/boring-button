<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5e642">
  <title>страница не найдена — boring button</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f9f8f1; color: #20231c; font: 16px/1.6 "Trebuchet MS", sans-serif; }
    main { max-width: 40rem; padding: clamp(24px, 6vw, 56px); border: 1px solid #20231c; border-radius: 4px; background: #f5e642; }
    .mark { color: #243de8; font-size: 80px; line-height: 1; margin-bottom: 28px; }
    .label { font-size: 12px; margin: 0 0 20px; }
    h1 { margin: 0 0 20px; font-size: clamp(36px, 7vw, 60px); letter-spacing: -2px; line-height: 1.05; }
    p { margin: 0 0 28px; }
    a { display: inline-block; padding: 12px 20px; background: #243de8; color: white; border: 1px solid #1427a2; border-radius: 4px; text-decoration: none; }
    a:hover { background: #1427a2; }
    a:focus-visible { outline: 3px solid #20231c; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✳</div>
    <p class="label">boring button / 404</p>
    <h1>кажется, ты свернул не туда.</h1>
    <p>этой страницы нет. на главной есть кнопка и одно маленькое дело.</p>
    <a href="https://chebaturkin.github.io/boring-button/">нажать кнопку ↗</a>
  </main>
</body>
</html>
