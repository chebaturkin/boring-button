<!doctype html>
<html lang="en">
<head>
  <base href="/boring-button/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title data-i18n="notFound.title">page not found: boring button</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f7f8fa; color: #20242b; font: 16px/1.6 "Trebuchet MS", sans-serif; }
    main { max-width: 40rem; padding: clamp(24px, 6vw, 56px); border: 1px solid #c9ced5; border-radius: 24px; background: white; }
    h1 { margin: 0 0 20px; font-size: clamp(36px, 7vw, 60px); letter-spacing: -2px; line-height: 1.05; }
    p { margin: 0 0 28px; }
    a { display: inline-block; padding: 12px 20px; background: #243de8; color: white; border: 1px solid #1427a2; border-radius: 4px; text-decoration: none; }
    a:hover { background: #1427a2; }
    a:focus-visible { outline: 3px solid #20231c; outline-offset: 5px; }
  </style>
  <script src="i18n.js"></script>
</head>
<body>
  <main>
    <h1 data-i18n="notFound.heading">page not found</h1>
    <p data-i18n="notFound.body">check the address or return to the button.</p>
    <a href="https://chebaturkin.github.io/boring-button/" data-i18n="notFound.link">back to the button</a>
  </main>
  <script src="not-found.js"></script>
</body>
</html>
